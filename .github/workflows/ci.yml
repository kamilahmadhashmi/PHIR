name: CI / Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Integrity Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.143.2 uvicorn==0.54.0 pydantic==2.14.1 httpx==0.28.1

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify deterministic seed data fixture
        run: |
          python scripts/seed_demo_data.py > /dev/null

      - name: Verify frontend build reproducibility
        run: |
          python scripts/build_fast_frontend.py --output frontend/amplify-site
          git diff --exit-code -- frontend/amplify-site
