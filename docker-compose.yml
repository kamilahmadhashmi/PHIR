version: '3.8'

services:
  phir-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phir-recovery-platform
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PHIR_DB_PATH=/app/data/phir.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
