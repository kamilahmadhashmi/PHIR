[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phir-platform"
version = "0.1.0"
description = "Domain logic for coordinating recyclable household material recovery"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["recovery_domain"]
package-dir = {"" = "src"}
